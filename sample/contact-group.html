<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>取引先/送り先 新規登録</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #000;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #ddd;
      text-align: center;
      font-weight: bold;
    }
    main {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}
    section {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    label {
      display: block;
      margin-bottom: 15px;
    }
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .small-note {
      display: block;
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .postal-code-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .postal-code-wrapper input {
      width: 120px;
    }
    textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 220px; /* 左カラムの幅分 */
      width: calc(100% - 220px); /* 左カラム除いた幅 */
      text-align: center;
      padding: 15px;
      border-top: 1px solid #ddd;
      background-color: #fff;
    }
    button {
      background-color: #00B4D2;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 0 10px;
    }
    button.cancel {
      background-color: #888;
    }
    .inline-button {
      background-color: #00B4D2;
      color: #fff;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  取引先/送り先を新規登録
</header>

<main>
  <section>
    <h2>基本情報</h2>
    <label>取引先名 <span style="color: red;">*</span>
      <input type="text" placeholder="取引先名を入力" />
    </label>
    <label>ふりがな
      <input type="text" placeholder="ふりがなを入力" />
    </label>
    <h3>送り先</h3>
    <label>管理コード
      <input type="text" placeholder="管理コードを入力" />
      <span class="small-note">請求書のCSV一括作成時に使用する任意の文字列を設定できます。</span>
    </label>
    <label>部署・担当者
      <input type="text" placeholder="部署・担当者名を入力" />
    </label>
    <label>メールアドレス
      <input type="email" placeholder="メールアドレスを入力" />
    </label>
    <label>郵便番号
      <div class="postal-code-wrapper">
        <input type="text" placeholder="0000000" />
        <button class="inline-button">郵便番号から検索</button>
      </div>
      <span class="small-note">0000000形式（半角）で入力してください。</span>
    </label>
    <label>住所
      <input type="text" placeholder="住所を入力" />
    </label>
    <label>電話番号
      <input type="text" placeholder="電話番号を入力" />
    </label>
  </section>

  <section>
    <h2>メモ</h2>
    <textarea rows="4" placeholder="メモを入力"></textarea>
    <span class="small-note">請求書などの文書面には印字されません。</span>
  </section>
</main>

<footer>
  <button class="cancel">キャンセル</button>
  <button>登録する</button>
</footer>

</body>
</html>
